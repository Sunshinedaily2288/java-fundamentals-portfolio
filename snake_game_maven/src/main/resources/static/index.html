<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade Snake Matrix</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .arcade-cabinet { max-width: 900px; width: 100%; display: grid; grid-template-columns: 500px 1fr; gap: 30px; }
        @media (max-width: 850px) { .arcade-cabinet { grid-template-columns: 1fr; } }

        header { grid-column: 1 / -1; text-align: center; margin-bottom: 10px; }
        h1 { color: #22c55e; font-size: 2.5rem; margin: 0 0 4px 0; font-weight: 800; letter-spacing: -0.025em; text-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }

        /* High-Performance Canvas Game Frame Grid Layout */
        .game-frame { background: #020617; border: 4px solid #1e293b; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        canvas { background: #000000; border: 2px solid #334155; border-radius: 6px; display: block; outline: none; }
        .score-banner { display: flex; justify-content: space-between; width: 100%; max-width: 400px; margin-bottom: 10px; font-family: monospace; font-size: 1.25rem; font-weight: 700; color: #22c55e; }

        /* Persistent Scoreboard Spreadsheet Columns Layout */
        .scoreboard-panel { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; }
        h2 { margin: 0 0 16px 0; font-size: 1.25rem; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { color: #94a3b8; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; padding-bottom: 10px; border-bottom: 2px solid #334155; }
        td { padding: 12px 4px; border-bottom: 1px solid #334155; color: #cbd5e1; }
        tr.top-rank { color: #f59e0b; font-weight: 700; }
    </style>
</head>
<body>

<div class="arcade-cabinet">
    <header>
        <h1>Arcade Snake Matrix</h1>
        <p style="color: #64748b; margin: 0; font-size: 0.95rem;">Algorithmic Grid Engine // Spring Boot API Score Tracking</p>
    </header>

    <!-- Game Frame Canvas Rendering Node Box -->
    <div class="game-frame">
        <div class="score-banner">
            <span>SCORE: <span id="currentScore">000</span></span>
            <span style="color: #38bdf8;" id="gameStatus">PRESS ANY ARROW</span>
        </div>
        <!-- canvas tag requires a tabIndex to listen for key events natively -->
        <canvas id="gameCanvas" width="400" height="400" tabindex="1"></canvas>
        <p style="color: #475569; font-size: 0.75rem; margin-top: 10px; font-family: monospace;">CLICK INSIDE CANVAS FRAME TO CAPTURE INPUT KEYBOARD CONTROLS</p>
    </div>

    <!-- Persistent SQL Leaderboard Table Component Grid View -->
    <div class="scoreboard-panel">
        <h2>🏆 Top 10 Global Registry</h2>
        <table>
            <thead>
            <tr>
                <th style="width: 50px;">Rank</th>
                <th>Operator Identity</th>
                <th style="text-align: right;">High Score</th>
            </tr>
            </thead>
            <tbody id="leaderboardBody">
            <tr><td colspan="3" style="text-align: center; color: #475569; padding: 20px 0;">Synchronizing scores database pipeline...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8083/api/leaderboard';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Pixel Grid Parameters Configuration Mapping
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let apple = { x: 5, y: 5 };
    let dx = 0, dy = 0;
    let score = 0;
    let gameInterval = null;
    let isGameOver = false;

    // Auto-focus canvas on load so keyboard commands register right away
    window.onload = () => {
        canvas.focus();
        generateApple();
        renderCanvas();
        loadLeaderboard();
    };

    // Capture arrow controls on the focused canvas element
    canvas.addEventListener('keydown', e => {
        if (isGameOver) return;
        // Prevent arrow keys from scrolling the webpage up/down
        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            e.preventDefault();
        }
        switch(e.key) {
            case 'ArrowUp':    if (dy === 0) { dx = 0; dy = -1; startGameLoop(); } break;
            case 'ArrowDown':  if (dy === 0) { dx = 0; dy = 1; startGameLoop(); } break;
            case 'ArrowLeft':  if (dx === 0) { dx = -1; dy = 0; startGameLoop(); } break;
            case 'ArrowRight': if (dx === 0) { dx = 1; dy = 0; startGameLoop(); } break;
        }
    });

    function startGameLoop() {
        document.getElementById('gameStatus').textContent = "SYSTEM ACTIVE";
        document.getElementById('gameStatus').style.color = "#22c55e";
        if (!gameInterval) gameInterval = setInterval(updateFrame, 120);
    }

    // Core Matrix Algorithmic Loop Pipeline Logic Execution
    function updateFrame() {
        // Calculate next position coordinates
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Wall boundaries coordinate collision checks validation parameters
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkSelfCollision(head)) {
            handleGameOver();
            return;
        }

        snake.unshift(head);

        // Item generation intersection mapping logic
        if (head.x === apple.x && head.y === apple.y) {
            score += 10;
            document.getElementById('currentScore').textContent = String(score).padStart(3, '0');
            generateApple();
        } else {
            snake.pop();
        }

        renderCanvas();
    }

    function checkSelfCollision(head) {
        return snake.some(segment => segment.x === head.x && segment.y === head.y);
    }

    function generateApple() {
        apple.x = Math.floor(Math.random() * tileCount);
        apple.y = Math.floor(Math.random() * tileCount);
        // Confirm item doesn't drop straight onto snake body parameters
        if (snake.some(s => s.x === apple.x && s.y === apple.y)) generateApple();
    }

    function renderCanvas() {
        // Clear frame canvas view node elements context
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Render Apple Target Element
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(apple.x * gridSize, apple.y * gridSize, gridSize - 2, gridSize - 2);

        // Render Snake Segment Nodes Columns Grid elements
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? '#4ade80' : '#22c55e';
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        });
    }

    async function handleGameOver() {
        clearInterval(gameInterval);
        gameInterval = null;
        isGameOver = true;
        document.getElementById('gameStatus').textContent = "GAME OVER";
        document.getElementById('gameStatus').style.color = "#ef4444";

        const initials = prompt(`CRITICAL IMPACT DETECTED! Your final score is ${score}.\nEnter identity signatures initials (3 characters Max) to upload to H2 database records registry:`);
        if (initials) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerName: initials.toUpperCase().substring(0, 3), score: score })
                });
            } catch (err) {
                console.error("Database tracking transmission crash:", err);
            }
        }
        resetGame();
    }

    function resetGame() {
        snake = [{ x: 10, y: 10 }];
        dx = 0; dy = 0; score = 0; isGameOver = false;
        document.getElementById('currentScore').textContent = "000";
        document.getElementById('gameStatus').textContent = "PRESS ANY ARROW";
        document.getElementById('gameStatus').style.color = "#38bdf8";
        generateApple();
        renderCanvas();
        loadLeaderboard();
    }

    // GET request server mapping pipelines execution pipeline route
    async function loadLeaderboard() {
        try {
            const response = await fetch(API_URL);
            const scores = await response.json();
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (scores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #475569; padding: 20px 0;">No logs committed to high-score tables registry yet.</td></tr>`;
                return;
            }

            scores.forEach((entry, index) => {
                const rowClass = index === 0 ? 'top-rank' : '';
                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td>#${index + 1}</td>
                        <td style="font-family: monospace; letter-spacing: 0.1em; font-weight: 700;">${entry.playerName}</td>
                        <td style="text-align: right; font-weight: 600; font-family: monospace;">${entry.score}</td>
                    </tr>
                `;
            });
        } catch (err) {
            console.error("Error connecting scoreboard server pipeline data matrix stream:", err);
        }
    }
</script>
</body>
</html>
