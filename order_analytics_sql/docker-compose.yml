version: '3.8'
services:
  postgres-db:
    image: postgres:15-alpine
    container_name: analytics_postgres
    environment:
      POSTGRES_USER: matharsa_dev
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
