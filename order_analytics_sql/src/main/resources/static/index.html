<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relational SQL Analytics Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 750px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 24px; }
        h2 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        .form-inline { display: flex; gap: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #475569; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background: #0f172a; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; align-self: flex-end; height: 40px; }
        button:hover { background: #1e293b; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Insert New Order Data (SQL Write)</h2>
        <form id="orderForm" class="form-inline">
            <div class="form-group">
                <label for="sku">Product SKU</label>
                <input type="text" id="sku" value="PROD-JAVA-17" required>
            </div>
            <div class="form-group">
                <label for="qty">Quantity</label>
                <input type="number" id="qty" value="5" min="1" required>
            </div>
            <div class="form-group">
                <label for="price">Unit Price ($)</label>
                <input type="number" id="price" value="29.99" step="0.01" required>
            </div>
            <button type="submit">Execute INSERT</button>
        </form>
    </div>

    <div class="card">
        <h2>Live Database Records (SQL Query Analytics)</h2>
        <table>
            <thead>
            <tr>
                <th>Database ID</th>
                <th>Product SKU</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Total Revenue</th>
            </tr>
            </thead>
            <tbody id="cryptoTableBody">
            <!-- Dynamically generated database rows go here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchDatabaseRows() {
        const response = await fetch('/api/v1/analytics/orders');
        const orders = await response.json();
        const tbody = document.getElementById('cryptoTableBody');
        tbody.innerHTML = '';

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Database empty. Execute an INSERT above!</td></tr>';
            return;
        }

        orders.forEach(order => {
            const row = `<tr>
                <td><strong>#${order.id}</strong></td>
                <td>${order.itemSku}</td>
                <td>${order.quantity}</td>
                <td>$${order.unitPrice.toFixed(2)}</td>
                <td style="color:#16a34a; font-weight:600;">$${order.totalRevenue.toFixed(2)}</td>
            </tr>`;
            tbody.insertAdjacentHTML('beforeend', row);
        });
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const sku = document.getElementById('sku').value;
        const qty = document.getElementById('qty').value;
        const price = document.getElementById('price').value;

        // Sending matching URL parameters to our Controller's @RequestParam bindings
        await fetch(`/api/v1/analytics/orders?sku=${encodeURIComponent(sku)}&qty=${qty}&price=${price}`, {
            method: 'POST'
        });

        fetchDatabaseRows();
    });

    // Initial table draw when webpage pulls up
    fetchDatabaseRows();
</script>
</body>
</html>
