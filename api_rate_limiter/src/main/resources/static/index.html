<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Rate Limiter Shield</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9; color: #0f172a; padding: 40px;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 650px; background-color: #ffffff;
            border-radius: 24px; padding: 40px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 800; color: #0284c7; }
        .port-badge { background-color: #ef4444; color: white; padding: 6px 12px; border-radius: 8px; font-family: monospace; font-size: 14px; font-weight: bold; }

        /* High-visibility clean console status display box */
        .status-display {
            background-color: #f8fafc; border-radius: 16px; padding: 24px;
            min-height: 120px; font-family: monospace; margin-bottom: 24px;
            border: 2px solid #e2e8f0; font-size: 14px; line-height: 1.6; color: #334155;
        }
        .log-success { color: #166534; background-color: #f0fdf4; border-color: #bbf7d0; }
        .log-error { color: #991b1b; background-color: #fef2f2; border-color: #fca5a5; font-weight: bold; }

        .btn-fire {
            width: 100%; background-color: #0284c7; color: #ffffff; border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: transform 0.1s, background-color 0.2s; text-transform: uppercase;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
        }
        .btn-fire:hover { background-color: #0369a1; }
        .btn-fire:active { transform: scale(0.98); }

        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
        .metric-card { background-color: #f8fafc; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .metric-label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 24px; font-weight: 800; color: #0f172a; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛡️ API THROTTLE &amp; RATE LIMITER SHIELD</h1>
        <div class="port-badge">PORT: 8087</div>
    </div>

    <div class="status-display" id="consoleLog">
        [System Idle] Ready to test pipeline network traffic telemetry... Click the trigger button below to fire an API hit request.
    </div>

    <button class="btn-fire" onclick="fireAPIRequest()">⚡ Fire API Endpoint Hit ⚡</button>

    <div class="metric-grid">
        <div class="metric-card">
            <div class="metric-label">Token Bucket Capacity</div>
            <div class="metric-value" style="color: #0284c7;">5 / 5</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Last Status Code</div>
            <div class="metric-value" id="statusCode">---</div>
        </div>
    </div>
</div>

<script>
    async function fireAPIRequest() {
        const consoleLog = document.getElementById('consoleLog');
        const statusDisplay = document.getElementById('statusCode');

        try {
            const response = await fetch('/api/secure/data');
            const data = await response.json();

            statusDisplay.innerText = response.status;

            if (response.status === 200) {
                statusDisplay.style.color = '#166534';
                consoleLog.className = "status-display log-success";
                consoleLog.innerHTML = `🟢 [HTTP 200 OK]<br>${data.message}<br>Remaining Available Tokens: ${data.tokensRemaining}`;
            } else {
                statusDisplay.style.color = '#991b1b';
                consoleLog.className = "status-display log-error";
                consoleLog.innerHTML = `🔴 [HTTP 429 Too Many Requests]<br>${data.message}`;
            }
        } catch (error) {
            consoleLog.className = "status-display log-error";
            consoleLog.innerHTML = `❌ Network transmission error connecting to security gateway.`;
        }
    }
</script>
</body>
</html>
