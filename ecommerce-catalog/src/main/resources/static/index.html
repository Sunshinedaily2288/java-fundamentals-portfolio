<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Catalog Engine</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg);
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { font-size: 28px; font-weight: 700; color: var(--text-main); margin: 0; }

        .status-badge {
            padding: 6px 14px;
            background-color: #dcfce7;
            color: #166534;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 13px;
        }

        /* Control Panel Grid (Search + Currency) */
        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .search-section, .currency-section {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-input, .select-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            background: white;
            outline: none;
        }

        .search-input:focus, .select-input:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .btn:hover { background: var(--primary-hover); }

        /* Product Cards */
        .catalog-grid { display: flex; flex-direction: column; gap: 16px; }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-name { font-size: 18px; font-weight: 600; color: var(--text-main); }
        .tag-container { display: flex; gap: 6px; margin-top: 6px; }
        .tag-chip { font-size: 11px; font-weight: 600; background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; }
        .seo-link { font-size: 12px; color: var(--primary); font-family: monospace; margin-top: 6px; }
        .product-price { color: var(--success); font-size: 22px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>Enterprise Catalog Dashboard</h1>
            <p style="color: var(--text-muted); margin: 4px 0 0 0;">Java Backend Engine + SAP Multi-Currency Integration Matrix</p>
        </div>
        <div class="status-badge">Gateway Secure</div>
    </header>

    <!-- 🔍 Controls Interface Section -->
    <div class="controls-grid">
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="Search parameters (e.g. 'java')...">
            <button class="btn" onclick="executeSearchAndCurrency()">Apply</button>
        </div>
        <div class="currency-section">
            <!-- 🚀 SAP Multi-Currency Selection Form Element -->
            <select id="currencyInput" class="select-input" onchange="executeSearchAndCurrency()">
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
            </select>
        </div>
    </div>

    <main>
        <div class="catalog-grid" id="catalogContainer"></div>
    </main>
</div>

<script>
    window.onload = () => executeSearchAndCurrency();

    function executeSearchAndCurrency() {
        const query = document.getElementById('searchInput').value.trim();
        const currency = document.getElementById('currencyInput').value;

        // 🔗 Combines search parameters and currency request tags onto a single REST url line
        let targetUrl = `/api/products?currency=${currency}`;
        if (query) {
            targetUrl += `&search=${encodeURIComponent(query)}`;
        }

        fetchCatalogData(targetUrl, currency);
    }

    function fetchCatalogData(targetUrl, currentCurrency) {
        const container = document.getElementById('catalogContainer');
        container.innerHTML = '<p style="color: var(--text-muted);">Syncing asset matrix configurations...</p>';

        // Map standard currency symbols for layout formatting
        const currencySymbols = { 'USD': '$', 'EUR': '€', 'GBP': '£' };
        const symbol = currencySymbols[currentCurrency] || '$';

        fetch(targetUrl)
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(products => {
                container.innerHTML = '';
                if (products.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted);">Zero elements match current parameter bounds.</p>';
                    return;
                }
                products.forEach(p => {
                    const tagsHtml = p.tags.map(tag => `<span class="tag-chip">${tag}</span>`).join('');
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <div class="product-name">${p.name}</div>
                            <div class="tag-container">${tagsHtml}</div>
                            <div class="seo-link">🔗 slug: /seo/${p.seoSlug}</div>
                        </div>
                        <div>
                            <!-- Displays recalculation matrix outputs straight out of the Java Service layers -->
                            <div class="product-price">${symbol}${p.price.toFixed(2)}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => {
                container.innerHTML = '<p style="color: red;">Compilation/Network fault. Confirm Spring Boot port 8085 is listening.</p>';
            });
    }
</script>
</body>
</html>
