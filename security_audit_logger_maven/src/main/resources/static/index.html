<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make.com Live Gateway Console</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--card); padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: var(--accent); margin-top: 0; border-bottom: 2px solid #334155; padding-bottom: 12px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        label { font-size: 14px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        input, select { background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; font-size: 15px; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 16px; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .console { background: #020617; border: 1px solid #1e293b; font-family: monospace; padding: 16px; border-radius: 8px; margin-top: 24px; max-height: 150px; overflow-y: auto; color: #4ade80; font-size: 13px; text-align: left; }
    </style>
</head>
<body>
<div class="container">
    <h2>🔌 Make.com Gateway Agent</h2>

    <div class="form-group">
        <label>Target Username</label>
        <input type="text" id="username" value="portfolio_tester">
    </div>

    <div class="form-group">
        <label>Security Event Status</label>
        <select id="event_type">
            <option value="LOGIN_SUCCESS">LOGIN_SUCCESS (Allow)</option>
            <option value="LOGIN_FAILED">LOGIN_FAILED (Deny 🚨)</option>
        </select>
    </div>

    <button onclick="dispatchPayload()">Fire Security Audit Event</button>

    <div class="console" id="output">System initialized. Ready to pipeline payloads...</div>
</div>

<script>
    function dispatchPayload() {
        const username = document.getElementById('username').value;
        const eventType = document.getElementById('event_type').value;
        const logBox = document.getElementById('output');

        const simulatedPayload = {
            timestamp: new Date().toISOString(),
            project: "security_audit_logger_maven",
            username: username,
            event_type: eventType,
            ip_address: "127.0.0.1",
            client_browser: "Web-UI-Console/2.0"
        };

        logBox.innerHTML += `<br>[${new Date().toLocaleTimeString()}] Sent Data to Cloud: ${JSON.stringify(simulatedPayload)}`;
        logBox.scrollTop = logBox.scrollHeight;
    }
</script>
</body>
</html>
